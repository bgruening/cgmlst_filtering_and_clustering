name: cgmlst_filtering_and_clustering
owner: ajkarloss
description: Filter ChewBBACA cgMLST allele profiles and generate clustering trees
long_description: |
  Galaxy wrapper for filtering ChewBBACA cgMLST allele call results.

  This tool removes samples with too many missing allele calls, calculates a
  Gower dissimilarity matrix, calculates pairwise Hamming distances, and
  generates a Newick tree using either single-linkage hierarchical clustering
  or neighbor joining.
categories:
  - Phylogenetics
  - Sequence Analysis
  - Microbiology
