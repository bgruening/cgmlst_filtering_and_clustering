name: Test CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::tibble
            any::cluster
            any::purrr
            any::ape

      - name: Run R script
        run: Rscript --vanilla filter_and_cluster.R --input test-data/results_alleles.tsv --clustering_method "nj"